<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#152230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon budget">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="logo192.png">
<link rel="icon" type="image/png" href="logo192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Mon budget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Mise en page : deux onglets (Mois, Budget), une colonne pensée pour le téléphone, calcul « prévu − dépensé = restant » en tête. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#152230; --muted:#5E6B78; --line:#DDE3E9;
  --accent:#2447D6; --accent-ink:#FFFFFF; --good:#1E7F5C; --bad:#C0392B; --warn:#B7791F;
  --hero-bg:#152230; --hero-fg:#F3F6F9; --hero-muted:#9FB0C0; --hero-good:#5FD3A0; --hero-bad:#FF8E80;
  --track:#E4E9EE; --shadow:0 -6px 24px rgba(21,34,48,.08);
  --c1:#2447D6; --c2:#E08A00; --c3:#1E9E7A; --c4:#C4457A; --c5:#7A5AF0; --c6:#D9534F; --c7:#2AA3C4; --c8:#8A94A0; --c9:#A0522D; --c10:#5B8C00; --c11:#0E7C86; --c12:#B5651D;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --surface:#161E26; --ink:#E8EDF2; --muted:#93A1AE; --line:#25303A;
    --accent:#7C9CFF; --accent-ink:#0E1419; --good:#4CC38A; --bad:#FF7B6B; --warn:#E3AE4D;
    --hero-bg:#1E2A36; --track:#25303A; --shadow:0 -6px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#161E26; --ink:#E8EDF2; --muted:#93A1AE; --line:#25303A;
  --accent:#7C9CFF; --accent-ink:#0E1419; --good:#4CC38A; --bad:#FF7B6B; --warn:#E3AE4D;
  --hero-bg:#1E2A36; --track:#25303A; --shadow:0 -6px 24px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;padding-bottom:100px}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:700;text-wrap:balance}
h2{font-size:18px;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}

.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 14px}
.mnav h1{font-size:22px;text-transform:capitalize;letter-spacing:-.02em}
.mnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}

.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:18px 16px 18px}
.hero .calc{display:grid;grid-template-columns:1fr auto 1fr auto 1.25fr;gap:9px;align-items:end}
.hero .calc>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.hero .calc span{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--hero-muted)}
.hero .calc b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.hero .calc i{font-style:normal;font-size:22px;color:var(--hero-muted);padding-bottom:1px}
.hero .res b{font-size:24px}
.hero .res b.pos{color:var(--hero-good)}.hero .res b.neg{color:var(--hero-bad)}
.hero .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.14);margin-top:16px;overflow:hidden}
.hero .bar div{height:100%;border-radius:5px;background:var(--hero-good)}
.hero .bar div.warn{background:#E3AE4D}.hero .bar div.over{background:var(--hero-bad)}

.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:12px 14px;
  border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.empty{color:var(--muted);margin:6px 0 2px}

.sec{margin-top:22px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px}
.sh .tot{font-weight:600}
.shs{color:var(--muted);font-size:13px;padding:2px 2px 8px}
ul.cl,ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
ul.cl li+li,ul.list li+li{border-top:1px solid var(--line)}
.crow{display:block;width:100%;text-align:left;border:0;background:transparent;padding:14px 14px 13px}
.crow:active{background:var(--bg)}
.crow .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.crow .l{display:flex;align-items:center;gap:10px;min-width:0}
.crow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.crow .r{text-align:right;flex:none}
.crow .rv{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.crow .rl{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.track{height:8px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:9px}
.fill{height:100%;border-radius:5px;background:var(--accent)}
.fill.warn{background:var(--warn)}.fill.over{background:var(--bad)}.fill.good{background:var(--good)}
@media (prefers-reduced-motion:no-preference){.fill,.hero .bar div{transition:width .3s}}

.bil{margin-top:14px;padding:12px 14px}
.g6{display:grid;grid-template-columns:44px 1fr auto 1fr auto 1fr;gap:4px;align-items:baseline;padding:4px 0}
.g6.hd span{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.g6 .lb{color:var(--muted);font-size:13px}
.g6 b{font-size:15px;white-space:nowrap;min-width:0}
.g6 i{font-style:normal;color:var(--muted)}
.donutwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donutwrap svg{width:100%;max-width:150px;height:auto;display:block}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.legend li{display:grid;grid-template-columns:10px 1fr;column-gap:8px;row-gap:0;align-items:center;font-size:14px;min-width:0}
.legend .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.legend .vl{grid-column:2;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin:10px 0 16px}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card p{margin:0}
.rep{display:grid;gap:10px}
.rep .t{font-size:14px;color:var(--muted)}
.brow{display:grid;grid-template-columns:1fr 112px;gap:4px 12px;align-items:center;padding:12px 14px}
.brow .nm{display:flex;align-items:center;gap:10px;font-weight:500;min-width:0}
.brow .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .del{grid-column:1/-1}
.bin,.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bin{text-align:right}
.lnk{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px 0;min-height:32px}
.lnk.confirm{color:var(--bad);font-weight:600}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.addrow input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.err{color:var(--bad);font-size:14px;margin:4px 2px 0}
.tools{margin-top:22px;display:grid;gap:8px}

#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:var(--shadow);padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));z-index:5}
#tabs button{border:0;background:transparent;padding:10px 2px;font-size:15px;font-weight:600;color:var(--muted);border-radius:10px;position:relative;min-height:52px}
#tabs button[aria-current="page"]{color:var(--accent)}
#tabs button[aria-current="page"]::after{content:"";position:absolute;left:35%;right:35%;top:0;height:3px;border-radius:2px;background:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:88vw;text-align:center}

#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,16,22,.5)}
#panel{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:16px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph p{margin:2px 0 0;color:var(--muted);font-size:14px;text-transform:capitalize}
.ph h2{font-size:21px}
.x{border:0;background:transparent;color:var(--muted);min-width:44px;height:44px;font-size:26px;border-radius:10px;flex:none}
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.s3>div{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.s3 span{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.s3 b{font-family:var(--f-display);font-size:18px;white-space:nowrap}
#addform{display:grid;gap:10px;margin:6px 0 14px}
.field{display:grid;gap:5px}.field label{font-size:13px;color:var(--muted);font-weight:600}
.amount input{font-size:28px;font-family:var(--f-display);font-weight:700;padding:12px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.opsh{margin:14px 0 8px;font-size:15px}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 14px}
.row .d{font-size:13px;color:var(--muted);width:52px;flex:none}
.row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .am{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .xx{border:0;background:transparent;color:var(--muted);min-width:44px;height:44px;font-size:20px;border-radius:10px}
.row .xx.confirm{color:var(--bad);font-size:13px;font-weight:600}
@media (max-width:380px){.donutwrap{grid-template-columns:1fr;justify-items:center}.legend{width:100%}.g6 b{font-size:13.5px}.g6{grid-template-columns:38px 1fr auto 1fr auto 1fr}.hero .calc b{font-size:18px}.hero .res b{font-size:22px}.two{grid-template-columns:1fr}}
</style>

</head>
<body>
<main id="app"></main>
<nav id="tabs" aria-label="Pages">
  <button data-a="tab" data-v="month">Mois</button>
  <button data-a="tab" data-v="budget">Budget</button>
</nav>
<div id="toast" hidden></div>
<div id="sheet" hidden>
  <div id="panel" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="ph"><div><h2 id="sh-title"></h2><p id="sh-month"></p></div><button class="x" data-a="closesheet" aria-label="Fermer">×</button></div>
    <div class="s3" id="sh-sum"></div>
    <form id="addform" autocomplete="off">
      <div class="field amount"><label for="f-amount" id="f-amlabel">Nouvelle dépense (€)</label><input id="f-amount" inputmode="decimal" placeholder="0,00"></div>
      <div class="two">
        <div class="field"><label for="f-label">Libellé (facultatif)</label><input id="f-label" maxlength="60" placeholder="Ex. Supermarché"></div>
        <div class="field"><label for="f-date">Date</label><input id="f-date" type="date"></div>
      </div>
      <p class="err" id="f-err" role="alert"></p>
      <button type="submit" class="btn pri wide">Ajouter</button>
      <button type="button" class="btn wide" id="sh-fill" data-a="fill" hidden></button>
    </form>
    <h3 class="opsh" id="sh-ophead">Dépenses du mois</h3>
    <ul class="list" id="sh-ops"></ul>
  </div>
</div>

<script>
(function(){
var KEY='mon-budget-v2',OLD='mon-budget-v1';
var pad=function(n){return String(n).padStart(2,'0')};
var today=new Date();
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var cur=ymd(today).slice(0,7);
var uid=function(){return Math.random().toString(36).slice(2,9)};
function shiftM(m,k){var p=m.split('-').map(Number);var d=new Date(p[0],p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function dim(m){var p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
var f0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var f2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
function fm(v){v=Math.round(v*100)/100;return Math.abs(v-Math.round(v))<0.005?f0.format(Math.round(v)):f2.format(v)}
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function monthName(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
function dayShort(iso){var p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}).replace('.','')}
function parseAmount(v){
  var x=String(v).replace(/[\s  €]/g,''),lc=x.lastIndexOf(','),ld=x.lastIndexOf('.');
  if(lc>=0&&ld>=0){if(lc>ld)x=x.replace(/\./g,'').replace(',','.');else x=x.replace(/,/g,'')}
  else if(lc>=0){x=x.replace(/,/g,function(m,i){return i===lc?'.':''})}
  else if(ld>=0&&x.split('.').length>2){x=x.replace(/\./g,'')}
  return parseFloat(x);
}

/* ---------- données ---------- */
function seed(){
  var cats=[
    {id:'logement',n:'Logement',g:'fixe',c:1},{id:'assurances',n:'Assurances',g:'fixe',c:9},{id:'abonnements',n:'Abonnements',g:'fixe',c:7},
    {id:'courses',n:'Courses',g:'var',c:2},{id:'transport',n:'Transport',g:'var',c:3},{id:'restaurants',n:'Restaurants',g:'var',c:4},
    {id:'loisirs',n:'Loisirs',g:'var',c:5},{id:'sante',n:'Santé',g:'var',c:6},{id:'autres',n:'Autres dépenses',g:'var',c:8},
    {id:'salaire',n:'Salaire',g:'rev',c:3},{id:'autresrev',n:'Autres revenus',g:'rev',c:7}];
  var b={};b[cur]={salaire:2150,logement:720,assurances:85,abonnements:40,courses:350,transport:120,restaurants:100,loisirs:80,sante:60,autres:100};
  var dd=today.getDate(),tx=[];
  function add(day,cat,amount,label){tx.push({id:uid(),cat:cat,amount:amount,label:label,date:cur+'-'+pad(Math.min(day,dd)),ex:1})}
  add(1,'salaire',2150,'Salaire');add(1,'logement',720,'Loyer');add(2,'courses',86.4,'Supermarché');add(4,'transport',52,'Carburant');add(5,'restaurants',38.5,'Restaurant');add(dd,'courses',54.2,'Marché');add(dd,'loisirs',25,'Cinéma');
  return{cats:cats,budgets:b,tx:tx};
}
function migrate(){
  var o=null;try{o=JSON.parse(localStorage.getItem(OLD)||'null')}catch(e){}
  if(!o||!o.cats||!o.tx)return null;
  var cats=o.cats.filter(function(c){return c.t==='dep'}).map(function(c){return{id:c.id,n:c.n,g:c.g==='fixe'?'fixe':'var',c:c.c||8}});
  var ids={};cats.forEach(function(c){ids[c.id]=1});
  var tx=[],need=false,minM=cur;
  o.tx.forEach(function(t){if(t.type!=='dep')return;var cat=t.cat;if(!ids[cat]){cat='autres';need=true}
    tx.push({id:t.id||uid(),cat:cat,amount:t.amount,label:t.label||'',date:t.date,ex:t.ex?1:0});if(t.date.slice(0,7)<minM)minM=t.date.slice(0,7)});
  if(need&&!ids.autres){cats.push({id:'autres',n:'Autres dépenses',g:'var',c:8});ids.autres=1}
  var bm={};Object.keys(o.budgets||{}).forEach(function(k){if(o.budgets[k]>0&&ids[k])bm[k]=o.budgets[k]});
  var b={};b[minM]=bm;
  return{cats:cats,budgets:b,tx:tx};
}
var data=null;
try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){data=null}
if(!data||!data.cats)data=migrate()||seed();
(function ensureRev(){
  if(data.revOk)return;
  var o=null;try{o=JSON.parse(localStorage.getItem(OLD)||'null')}catch(e){}
  var ids={};data.cats.forEach(function(c){ids[c.id]=1});
  if(o&&o.cats){
    o.cats.filter(function(c){return c.t==='rev'}).forEach(function(c){if(!ids[c.id]){data.cats.push({id:c.id,n:c.n,g:'rev',c:c.c||3});ids[c.id]=1}});
    var have={};data.tx.forEach(function(t){have[t.id]=1});
    (o.tx||[]).forEach(function(t){if(t.type==='rev'&&ids[t.cat]&&t.id&&!have[t.id])data.tx.push({id:t.id,cat:t.cat,amount:t.amount,label:t.label||'',date:t.date,ex:t.ex?1:0})});
  }
  if(!data.cats.some(function(c){return c.g==='rev'})){
    if(!ids.salaire)data.cats.push({id:'salaire',n:'Salaire',g:'rev',c:3});
    if(!ids.autresrev)data.cats.push({id:'autresrev',n:'Autres revenus',g:'rev',c:7});
  }
  data.revOk=1;
})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
save();

var state={tab:'month',m:cur,sheet:null,confirm:null,err:{}};

/* ---------- calculs ---------- */
function inM(m){return data.tx.filter(function(t){return t.date.slice(0,7)===m})}
function budgetOf(m){
  if(data.budgets[m])return{map:data.budgets[m],from:m};
  var ks=Object.keys(data.budgets).filter(function(k){return k<m}).sort();
  if(ks.length){var k=ks[ks.length-1];return{map:data.budgets[k],from:k}}
  return{map:{},from:null};
}
function calc(m){
  var by={};inM(m).forEach(function(t){by[t.cat]=(by[t.cat]||0)+t.amount});
  var bm=budgetOf(m).map,res={fixe:{p:0,s:0,rows:[]},var:{p:0,s:0,rows:[]},rev:{p:0,s:0,rows:[]},P:0,S:0};
  data.cats.forEach(function(c){var p=bm[c.id]||0,s=by[c.id]||0,g=res[c.g];g.p+=p;g.s+=s;g.rows.push({c:c,p:p,s:s})});
  res.P=res.fixe.p+res.var.p;res.S=res.fixe.s+res.var.s;return res;
}
function setBudget(m,cat,val){
  if(!data.budgets[m]){var base=budgetOf(m).map,cp={};Object.keys(base).forEach(function(k){cp[k]=base[k]});data.budgets[m]=cp}
  if(val>0)data.budgets[m][cat]=Math.round(val*100)/100;else delete data.budgets[m][cat];
  save();
}

    var c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x0021,true);
    c.setUint32(16,crc,true);c.setUint32(20,db.length,true);c.setUint32(24,db.length,true);c.setUint16(28,nb.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);

    ['xl/workbook.xml',H+'<workbook xmlns="'+NS+'" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Opérations" sheetId="1" r:id="rId1"/><sheet name="Budget par catégorie" sheetId="2" r:id="rId2"/><sheet name="Récapitulatif" sheetId="3" r:id="rId3"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet3.xml"/><Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml',H+'<styleSheet xmlns="'+NS+'"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],
    ['xl/worksheets/sheet1.xml',sheetXml(r1,[12,10,24,10,32,14])],
    ['xl/worksheets/sheet2.xml',sheetXml(r2,[18,24,10,14,14,16])],
    ['xl/worksheets/sheet3.xml',sheetXml(r3,[18,18,18,18,14,16,16])]

  return zipFiles(files);
}
function download(blob,name){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u)},1500)}

/* ---------- affichage ---------- */
function render(){
  document.getElementById('app').innerHTML=state.tab==='month'?viewMonth():viewBudget();
  document.querySelectorAll('#tabs button').forEach(function(b){if(b.dataset.v===state.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
}
var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=el.dataset.id;
  if(a==='tab'){state.tab=el.dataset.v;state.confirm=null;state.err={};render();window.scrollTo(0,0)}
  else if(a==='prev'){state.m=shiftM(state.m,-1);state.confirm=null;render()}
  else if(a==='next'){state.m=shiftM(state.m,1);state.confirm=null;render()}
  else if(a==='pie'){state.pie=el.dataset.v;render()}
  else if(a==='open'){openSheet(id)}
  else if(a==='closesheet'){closeSheet()}
  else if(a==='fill'){
    var c=catById(state.sheet),r=calc(state.m),row=r[c.g].rows.filter(function(x){return x.c.id===c.id})[0],rs=row.p-row.s;
    if(rs>0){addOp(rs,'',defaultDate());drawSheet();render();toast('Enregistré.')}
  }
  else if(a==='deltx'){
    var key='tx:'+id;
    if(state.confirm===key){data.tx=data.tx.filter(function(t){return t.id!==id});state.confirm=null;save();drawSheet();render()}
    else{state.confirm=key;drawSheet()}
  }
  else if(a==='clearex'){data.tx=data.tx.filter(function(t){return !t.ex});save();render();toast('Exemples effacés.')}
  else if(a==='delcat'){
    var k='cat:'+id;
    if(state.confirm===k){delCat(id);state.confirm=null;render();toast('Catégorie supprimée.')}
    else{state.confirm=k;render()}
  }
  else if(a==='copyprev'){
    if(state.confirm!=='copy'&&data.budgets[state.m]&&Object.keys(data.budgets[state.m]).length){state.confirm='copy';render();return}
    var src=budgetOf(shiftM(state.m,-1)).map,cp={};Object.keys(src).forEach(function(k){cp[k]=src[k]});
    data.budgets[state.m]=cp;state.confirm=null;save();render();toast('Budget repris du mois précédent.');
  }
  else if(a==='xlsx'){
    try{download(buildXlsx(),'budget.xlsx');toast('Téléchargement lancé : budget.xlsx')}catch(err){toast('Export impossible sur cet appareil.')}
  }
});
document.getElementById('sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.sheet)closeSheet()});

document.getElementById('addform').addEventListener('submit',function(e){
  e.preventDefault();
  var err=document.getElementById('f-err'),amount=parseAmount(document.getElementById('f-amount').value);
  var date=document.getElementById('f-date').value,label=document.getElementById('f-label').value.trim();
  if(!(amount>0)){err.textContent='Saisis un montant supérieur à 0.';return}
  if(!date||date.slice(0,7)!==state.m){err.textContent='Choisis une date dans '+monthName(state.m)+'.';return}
  err.textContent='';addOp(amount,label,date);
  document.getElementById('f-amount').value='';document.getElementById('f-label').value='';
  drawSheet();render();toast('Enregistré.');
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.bud){var v=parseAmount(t.value);setBudget(state.m,t.dataset.bud,isNaN(v)?0:v);refreshTotals()}
});
document.addEventListener('submit',function(e){
  var f=e.target;if(!f.classList.contains('addrow'))return;
  e.preventDefault();
  var g=f.dataset.g,inp=f.querySelector('input'),n=inp.value.trim();
  if(!n){state.err[g]='Donne un nom à la catégorie.';render();return}
  if(data.cats.some(function(c){return c.n.toLowerCase()===n.toLowerCase()})){state.err[g]='Cette catégorie existe déjà.';render();return}
  var cnt={};data.cats.forEach(function(c){cnt[c.c]=(cnt[c.c]||0)+1});var best=1;for(var i=1;i<=12;i++){if((cnt[i]||0)<(cnt[best]||0))best=i}
  data.cats.push({id:'c'+uid(),n:n,g:g,c:best});state.err={};save();render();toast('Catégorie ajoutée.');
  var nx=document.getElementById('add-'+g);if(nx)nx.focus();
});

render();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js')}catch(e){}})}
